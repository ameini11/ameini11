name: generate language metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  languages:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: lowlighter/metrics@latest
        with:
          # PAT with `repo` scope, so private repositories are visible.
          token: ${{ secrets.PROFILE_TOKEN }}
          # Ordinary GITHUB_TOKEN is enough to commit the result back.
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.languages.svg
          # Empty base = render only the languages plugin, no default header card.
          base: ""
          config_timezone: America/Los_Angeles

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_colors: github

          # Indepth attributes code to whoever actually committed it, by cloning
          # each repo and running linguist over your commits. Without it a fork
          # would credit you with the whole upstream codebase.
          plugin_languages_indepth: no   # TEMP: bisecting the "0 languages" result
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5

          # Reach beyond public, owned, non-fork repos - which is the default.
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
          repositories: 200
